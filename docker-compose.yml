services:
  scrcpy-relay:
    # Pulls the image built by .github/workflows/docker-publish.yml on every
    # push to main. Set IMAGE_TAG in .env to pin a specific tag/sha instead
    # of floating on :latest. Uncomment the line below to build locally from
    # the Dockerfile instead (e.g. while hacking on entrypoint.sh).
    image: ghcr.io/the-code-labz/scrcpy-tablet-relay:${IMAGE_TAG:-latest}
    # build: .
    container_name: scrcpy-relay
    restart: unless-stopped
    ports:
      # Direct-publish fallback for anyone NOT running Traefik — exactly the
      # pre-Traefik behavior. ws-scrcpy has NO built-in authentication —
      # anyone who can reach this port gets live view + touch control of the
      # tablet. BIND_HOST is the ONLY thing standing between "Tailscale only"
      # and "open to your whole LAN", so set it to the relay host's Tailscale
      # IP in .env. Left at the 127.0.0.1 default, the relay is reachable
      # only from the host itself.
      #
      # Safe to leave this published even when fronting the service with
      # Traefik (see labels below) — it's an additional path in, not a
      # replacement for one. Set BIND_HOST=127.0.0.1 (or drop this block
      # entirely) if you want Traefik to be the ONLY way in.
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    environment:
      # Tablet wireless-adb endpoint (IP or Tailscale hostname)
      - TABLET_HOST=${TABLET_HOST:?Set TABLET_HOST in .env}
      # Optional: fast-path hint (last-known-good or legacy pinned `adb
      # tcpip` port). Leave blank for Wireless Debugging — the relay
      # auto-discovers and caches the live port itself (see
      # ADB_PORT_DISCOVERY below).
      - TABLET_PORT=${TABLET_PORT:-}
      # auto (default): scan for the live Wireless Debugging connect port
      # whenever the cached/pinned one stops working. off: only ever use
      # TABLET_PORT, never scan (for fixed-port legacy `adb tcpip` setups).
      - ADB_PORT_DISCOVERY=${ADB_PORT_DISCOVERY:-auto}
      # Port range scanned during discovery — default covers every
      # Wireless Debugging connect port observed in practice.
      - DISCOVERY_PORT_RANGE=${DISCOVERY_PORT_RANGE:-32768-61000}
      # How often the keepalive loop re-checks/reconnects adb (seconds)
      - KEEPALIVE_INTERVAL=${KEEPALIVE_INTERVAL:-30}
      # One-time pairing (Android 11+ Wireless debugging). Fill these in from
      # the tablet's "Pair device with pairing code" screen, redeploy once,
      # then blank them out again — the paired key persists in ./adb-data.
      - PAIR_HOST=${PAIR_HOST:-}
      - PAIR_PORT=${PAIR_PORT:-}
      - PAIR_CODE=${PAIR_CODE:-}
    volumes:
      # Persists ~/.android (adbkey + adbkey.pub + paired-device trust) so a
      # redeploy/recreate doesn't generate a fresh keypair and lose pairing.
      - ./adb-data:/root/.android
    networks:
      # Default bridge-type network for adb's outbound connection to the
      # tablet, PLUS the external Traefik network below so Traefik's Docker
      # provider can reach the container directly (no published port needed
      # for that path). If adb can't reach the tablet through bridge-mode
      # NAT (isolated VLAN, some Tailscale subnet-router setups), the
      # old host-networking fallback still applies — but note `network_mode:
      # host` is NOT compatible with the `networks:`/`ports:` keys used here
      # at the same time; if you need it, drop both of those blocks first,
      # and Traefik label-based routing then requires a different setup
      # (route to the host's IP:8000 instead of the container).
      - default
      - traefik-network
    labels:
      # --- Traefik reverse-proxy wiring ---
      # ws-scrcpy is a plain HTTP/WebSocket server (no WSS of its own) —
      # Traefik terminates TLS and proxies the Upgrade: websocket handshake
      # through transparently on an http router with NO extra config: v2/v3
      # pass the Connection/Upgrade headers through by default on both
      # entrypoints. The one thing that WOULD break it is a compression
      # middleware (traefik.http.middlewares.*.compress) attached to this
      # router — don't add one.
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}"
      - "traefik.http.routers.scrcpy-relay.rule=Host(`${SCRCPY_HOSTNAME:-scrcpy.example.com}`)"
      - "traefik.http.routers.scrcpy-relay.entrypoints=websecure"
      - "traefik.http.routers.scrcpy-relay.tls=true"
      - "traefik.http.routers.scrcpy-relay.tls.certresolver=${TRAEFIK_CERTRESOLVER:-cloudflare}"
      - "traefik.http.routers.scrcpy-relay.service=scrcpy-relay"
      - "traefik.http.services.scrcpy-relay.loadbalancer.server.port=8000"

  # ---- Audio sidecar (optional) ----
  # ws-scrcpy's vendored scrcpy-server predates scrcpy's audio protocol, so
  # the main service above is video+touch only. This runs tango-mirror
  # instead (stock scrcpy v3.1, WebRTC video + Opus audio + touch) as a
  # SEPARATE service, on the SAME bridge network + Traefik pattern as
  # scrcpy-relay above (NOT network_mode: host — that needs Traefik to
  # reach a raw host-bound port, which many hardened hosts firewall off
  # for container-originated traffic; this way Traefik discovers it the
  # normal Docker-network way, identical to scrcpy-relay). WebRTC's ICE
  # still negotiates fine through ordinary Docker bridge NAT for most
  # networks (STUN handles cone NATs, which is what this is) — only a
  # genuinely symmetric NAT on the viewer's side would need TURN (see
  # README). Comment this whole service out if you don't need audio — the
  # video-only relay above works completely independently.
  scrcpy-audio:
    image: ghcr.io/the-code-labz/scrcpy-tablet-relay:${IMAGE_TAG:-latest}
    # build: .
    container_name: scrcpy-audio
    entrypoint: ["/usr/local/bin/entrypoint-audio.sh"]
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${TANGO_PORT:-8010}:${TANGO_PORT:-8010}"
    environment:
      - TABLET_HOST=${TABLET_HOST:?Set TABLET_HOST in .env}
      - TABLET_PORT=${TABLET_PORT:-}
      - TANGO_PORT=${TANGO_PORT:-8010}
      # Recommended but not required (entrypoint-audio.sh warns if unset).
      # Not security-critical the way host networking would have made it:
      # this service is only reachable via Traefik (mesh-gated, same
      # ipallowlist pattern as scrcpy-relay) or BIND_HOST, same as above.
      - TANGO_TOKEN=${TANGO_TOKEN:-}
      - KEEPALIVE_INTERVAL=${KEEPALIVE_INTERVAL:-30}
    volumes:
      # Same volume as scrcpy-relay — inherits the already-trusted adb
      # keypair AND the live Wireless Debugging port scrcpy-relay's own
      # entrypoint.sh discovers/caches, so this sidecar never needs its own
      # pairing step or port-discovery scan.
      - ./adb-data:/root/.android
    networks:
      - default
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}"
      - "traefik.http.routers.scrcpy-audio.rule=Host(`${SCRCPY_AUDIO_HOSTNAME:-scrcpy-audio.example.com}`)"
      - "traefik.http.routers.scrcpy-audio.entrypoints=websecure"
      - "traefik.http.routers.scrcpy-audio.tls=true"
      - "traefik.http.routers.scrcpy-audio.tls.certresolver=${TRAEFIK_CERTRESOLVER:-cloudflare}"
      - "traefik.http.routers.scrcpy-audio.service=scrcpy-audio"
      - "traefik.http.services.scrcpy-audio.loadbalancer.server.port=${TANGO_PORT:-8010}"
    depends_on:
      - scrcpy-relay

networks:
  default: {}
  traefik-network:
    # Traefik must already be attached to this network (Dokploy's default is
    # `dokploy-network`) — it only discovers containers on networks it's
    # watching, labels alone are not enough. Override the name via
    # TRAEFIK_NETWORK in .env if your Traefik uses something else, or delete
    # this network + the `traefik-network` entry under the service's
    # `networks:` and the `labels:` block entirely if you don't run Traefik.
    external: true
    name: ${TRAEFIK_NETWORK:-dokploy-network}
